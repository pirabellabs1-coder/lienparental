<?xml version="1.0" encoding="UTF-8"?>
<!-- Lien Parental — maskable 512. Logo inset by 10% safe-zone; background bleeds to edges. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lien Parental">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1a3f"/>
      <stop offset="100%" stop-color="#8347d1"/>
    </linearGradient>
  </defs>
  <!-- Full bleed background (maskable safe zone is the inner 80%) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- Logo scaled 0.8 and centered → leaves 10% padding on each side -->
  <g transform="translate(51.2 51.2) scale(0.8)">
    <path d="M 136 112 L 136 400 L 328 400 L 328 352 L 196 352 L 196 112 Z" fill="#ffffff"/>
    <g transform="translate(320 300)" fill="none" stroke="#1faf5c" stroke-width="18" stroke-linecap="round">
      <ellipse cx="0" cy="0" rx="42" ry="26" transform="rotate(-25)"/>
      <ellipse cx="46" cy="34" rx="42" ry="26" transform="rotate(-25 46 34)"/>
    </g>
  </g>
</svg>
